name: Build and Release (APKs + Web)

# Triggers:
#   - push of any tag starting with `v` (e.g. `v0.1.0`) → publishes a release
#   - manual dispatch                                   → builds without publishing
#
# Builds:
#   - app/ Android — split-per-abi + universal APKs
#   - app/ Web     — release web bundle, zipped
#
# APKs are signed with the debug key by default. To get upgrade-compatible
# signed APKs add these repo secrets and the workflow will pick them up
# automatically:
#   ANDROID_KEYSTORE_BASE64
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_notes:
        description: "Optional release notes (Markdown). Leave empty to auto-generate."
        required: false
        default: ""

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build APKs + Web
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Cache pub
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Pub get
        working-directory: app
        run: flutter pub get

      - name: Derive release version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(grep '^version:' app/pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          fi
          if [[ -z "$VERSION" ]]; then
            echo "::error::Could not determine version"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      # ── Optional release signing ─────────────────────────────
      - name: Detect keystore secret
        run: |
          if [[ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]]; then
            echo "HAVE_KEYSTORE=true" >> "$GITHUB_ENV"
          else
            echo "HAVE_KEYSTORE=false" >> "$GITHUB_ENV"
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set — APKs will be signed with the debug key (not upgrade-compatible)."
          fi

      - name: Decode signing keystore
        if: ${{ env.HAVE_KEYSTORE == 'true' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p app/android/app
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/android/app/torrex-release.keystore
          cat > app/android/key.properties <<EOF
          storeFile=torrex-release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      # ── Build ────────────────────────────────────────────────
      - name: Build APKs (split + universal)
        working-directory: app
        run: |
          flutter build apk --release --split-per-abi
          flutter build apk --release

      # ── Collect & rename ─────────────────────────────────────
      - name: Collect APKs
        run: |
          V=${{ steps.version.outputs.version }}
          mkdir -p release-apks
          OUT=app/build/app/outputs/flutter-apk
          for abi in arm64-v8a armeabi-v7a x86_64; do
            if [[ -f "$OUT/app-$abi-release.apk" ]]; then
              cp "$OUT/app-$abi-release.apk" "release-apks/torrex-v${V}-${abi}.apk"
            fi
          done
          if [[ -f "$OUT/app-release.apk" ]]; then
            cp "$OUT/app-release.apk" "release-apks/torrex-v${V}-universal.apk"
          fi
          ls -la release-apks/

      # ── Build web ───────────────────────────────────────────
      # Demo mode is intentionally NOT enabled (kAllowDemo defaults to
      # false in release). Mirrors scripts/vercel-build.sh.
      - name: Build web (release)
        working-directory: app
        run: flutter build web --release --base-href /

      - name: Package web bundle
        run: |
          V=${{ steps.version.outputs.version }}
          mkdir -p release-web
          (cd app/build/web && zip -r "$GITHUB_WORKSPACE/release-web/torrex-v${V}-web.zip" .)
          ls -la release-web/

      # ── Release notes ────────────────────────────────────────
      - name: Generate release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [[ -n "${{ github.event.inputs.release_notes }}" ]]; then
            echo "${{ github.event.inputs.release_notes }}" > release-notes.md
          else
            LAST_TAG=$(git describe --tags --abbrev=0 "HEAD^" 2>/dev/null || echo "")
            {
              echo "## Torrex v${{ steps.version.outputs.version }}"
              echo ""
              echo "Flutter Torznab/Jackett client built on the WolwoLoom design system."
              echo ""
              if [[ -n "$LAST_TAG" ]]; then
                echo "### Changes since \`$LAST_TAG\`"
                echo ""
                git log "${LAST_TAG}..HEAD" --pretty=format:"- %s (%h)" --no-merges -20
              else
                echo "### Recent commits"
                echo ""
                git log --pretty=format:"- %s (%h)" --no-merges -20
              fi
              echo ""
              echo ""
              echo "### Install"
              echo ""
              echo "- **\`torrex-v*-arm64-v8a.apk\`** — recommended for nearly every modern phone."
              echo "- **\`torrex-v*-universal.apk\`** — works on any architecture (larger)."
              echo "- **\`torrex-v*-web.zip\`** — static web bundle. Unzip and serve any subfolder, or just open the live build at <https://torrex.vercel.app>."
              echo ""
              echo "After installing, open Settings inside the app and paste your Jackett / Prowlarr URL + API key."
              echo "See [backend/huggingface-space/README.md](https://github.com/${{ github.repository }}/blob/main/backend/huggingface-space/README.md) to stand one up for free."
            } > release-notes.md
          fi
          cat release-notes.md

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: torrex-v${{ steps.version.outputs.version }}-apks
          path: release-apks/*.apk
          if-no-files-found: error

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: torrex-v${{ steps.version.outputs.version }}-web
          path: release-web/*.zip
          if-no-files-found: error

      - name: Create / update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" release-apks/*.apk release-web/*.zip --clobber
            gh release edit   "v$V" --notes-file release-notes.md --draft=false --latest
          else
            gh release create "v$V" release-apks/*.apk release-web/*.zip \
              --title "Torrex v$V" \
              --notes-file release-notes.md \
              --latest
          fi
