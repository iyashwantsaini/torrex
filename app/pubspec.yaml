name: torrex
description: "Torrex — Torznab/Jackett client with WolwoLoom design system."
publish_to: 'none'
version: 0.2.0+7

environment:
  sdk: ^3.11.5
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Design system
  wolwoloom: ^0.3.4

  # Networking + parsing
  dio: ^5.7.0
  xml: ^6.5.0

  # Storage
  shared_preferences: ^2.3.0
  flutter_secure_storage: ^9.2.2

  # Platform glue
  url_launcher: ^6.3.0
  share_plus: ^10.0.0

  # TMDB posters / Discover grid
  cached_network_image: ^3.4.1
  flutter_staggered_grid_view: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: launcher_icon
  ios: false
  remove_alpha_ios: true
  image_path: "assets/icon/torrex.png"
  adaptive_icon_background: "#0E0E10"
  adaptive_icon_foreground: "assets/icon/torrex_fg.png"
  web:
    generate: true
    image_path: "assets/icon/torrex.png"
    background_color: "#0E0E10"
    theme_color: "#989EDC"
  windows:
    generate: false
  macos:
    generate: false

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

